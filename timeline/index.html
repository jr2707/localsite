let allCountriesData = [];
window.selectedCustomCountries = [];

/* Also update home/index.html */
document.addEventListener('hashChangeEvent', function (elem) {
    console.log("Timeline page detects URL hashChangeEvent");
    let hash = getHash();
    if (!hash.scope) {
        hash.scope = "country"; // CUSTOM - also set in call to localsite.js above.
    }
    if (hash.scope != priorHash.scope || hash.goal != priorHash.goal) {
        const selectScope = document.getElementById("selectScope");
        if (selectScope) {
          selectScope.value = hash.scope;
        }
        updateDcidSelectFromSheet(hash.scope); // In localsite/js/earthscape.js
    }
}, false);
document.addEventListener('DOMContentLoaded', () => {
    let hash = getHash();
    if (!hash.scope) {
        hash.scope = document.getElementById('selectScope').options[document.getElementById('selectScope').selectedIndex].text;
    }
    //alert(hash.scope)
    updateDcidSelectFromSheet(hash.scope);
    
    // document.addEventListener('change', function(event) {
    //     if (event.target.name === 'whichLines') {
    //       console.log('whichLines changed to ' + event.target.value);
    //       refreshTimeline();
    //     }
    // });

    // Auto-hide functionality for countries list
    let hideTimeout;
    
    function setupAutoHide() {
        const countriesList = document.getElementById('countriesList');
        const whichLinesHolder = document.querySelector('.whichLinesHolder');
        
        if (!countriesList || !whichLinesHolder) return;
        
        // Clear any existing timeout when mouse enters the area
        function onMouseEnter() {
            clearTimeout(hideTimeout);
        }
        
        // Set timeout to hide when mouse leaves the area
        function onMouseLeave() {
            hideTimeout = setTimeout(() => {
                countriesList.classList.remove('visible');
            }, 500); // 500ms delay - adjust as needed
        }
        
        // Add event listeners to the container that holds both radio buttons and countries list
        whichLinesHolder.addEventListener('mouseenter', onMouseEnter);
        whichLinesHolder.addEventListener('mouseleave', onMouseLeave);
        
        // Also listen on the countries list itself since it might extend outside the holder
        countriesList.addEventListener('mouseenter', onMouseEnter);
        countriesList.addEventListener('mouseleave', onMouseLeave);
    }
    
    // Initialize auto-hide functionality
    setupAutoHide();

    window.handleCountrySelection = function(radio) {
        const countriesList = document.getElementById('countriesList');
        const allCountriesLabel = document.getElementById('all-countries-label');
        
        // Clear any pending hide timeout when user interacts
        clearTimeout(hideTimeout);
        
        // Clear custom selections when switching to other modes
        if (radio.value !== 'showCustom') {
            window.selectedCustomCountries = [];
            countriesList.classList.remove('visible');
        }
        
        if (radio.value === 'showAll' && !countriesLoaded) {
            allCountriesLabel.textContent = 'All (loading...)';
            countriesList.classList.add('visible');
            loadAllCountries();
        } else if (radio.value === 'showAll') {
            countriesList.classList.add('visible');
        } 
        
        // Always update the selection summary when radio button changes
        updateSelectionDisplay();
        
        refreshTimeline();
    }

    // Add this new function for loading countries
    async function loadAllCountries() {
        if (countriesLoaded) return;

        console.log('loadAllCountries called');
        
        try {
            // Use your existing country fetching logic from getTimelineChart
            const restResponse = await fetch("https://restcountries.com/v3.1/all?fields=cca2,name");
            const countriesData = await restResponse.json();
            const selectedCountries = countriesData.map(country => country.cca2).filter(Boolean);
            
            allCountriesData = selectedCountries;
            countriesLoaded = true;
            
            // Update label
            document.getElementById('all-countries-label').textContent = `All ${allCountriesData.length}`;
            
            // Populate list
            populateCountriesList(countriesData);
            
            // Update the selection summary to show the actual count
            updateSelectionDisplay();
            
        } catch (error) {
            console.error('Error loading countries:', error);
            document.getElementById('all-countries-label').textContent = 'All Countries (error)';
            updateSelectionDisplay(); // Update summary even on error
        }
    }

    function populateCountriesList(countriesData) {
        const countriesList = document.getElementById('countriesList');
        const loadingDiv = document.getElementById('loadingCountries');

        console.log('populateCountriesList called with', countriesData.length, 'countries');
        
        loadingDiv.style.display = 'none';
        
        countriesData.forEach(country => {
            console.log('Creating checkbox for:', country.name.common);
            const countryItem = document.createElement('div');
            countryItem.className = 'country-item';
            
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.id = `country-${country.cca2}`;
            checkbox.onchange = () => toggleCustomCountry(country.cca2, checkbox.checked);
            
            const label = document.createElement('label');
            label.htmlFor = checkbox.id;
            label.textContent = country.name.common;
            label.style.cursor = 'pointer';
            
            countryItem.appendChild(checkbox);
            countryItem.appendChild(label);
            countriesList.appendChild(countryItem);
        });
    }

    function toggleCustomCountry(countryCode, isSelected) {
        if (isSelected) {
            window.selectedCustomCountries.push(countryCode);
        } else {
            window.selectedCustomCountries = window.selectedCustomCountries.filter(c => c !== countryCode);
        }
        console.log('selectedCustomCountries:', window.selectedCustomCountries);
        updateSelectionDisplay();
        refreshTimeline();
    }
    function updateSelectionDisplay() {
        const selectionSummary = document.getElementById('selectionSummary');
        
        // NEVER hide radio buttons - only update the center summary text
        if (window.selectedCustomCountries && window.selectedCustomCountries.length > 0) {
            // Show custom countries in CENTER SUMMARY only
            if (window.selectedCustomCountries.length <= 3) {
                const countryNames = window.selectedCustomCountries.map(code => {
                    const checkbox = document.getElementById(`country-${code}`);
                    return checkbox ? checkbox.nextElementSibling.textContent : code;
                });
                selectionSummary.textContent = `${window.selectedCustomCountries.length} Countries: ${countryNames.join(', ')}`;
            } else {
                selectionSummary.textContent = `${window.selectedCustomCountries.length} Selected Countries`;
            }
            selectionSummary.style.fontStyle = 'italic';
        } else {
            // Show radio button selection in CENTER SUMMARY only
            const selectedRadio = document.querySelector('input[name="whichLines"]:checked');
            
            if (selectedRadio?.value === 'showAll') {
                // For "All Countries", show the actual count if available
                if (allCountriesData && allCountriesData.length > 0) {
                    selectionSummary.textContent = `All ${allCountriesData.length} Countries`;
                } else if (countriesLoaded) {
                    selectionSummary.textContent = 'All Countries (loaded)';
                } else {
                    selectionSummary.textContent = 'All Countries (loading...)';
                }
            } else {
                // For other selections, use the predefined labels
                const radioLabels = {
                    'showSelected': '11 Countries', 
                    'showTop5': 'Top 5 Countries',
                    'showBottom5': 'Bottom 5 Countries'
                };
                selectionSummary.textContent = radioLabels[selectedRadio?.value] || 'Top 5 Countries';
            }
            selectionSummary.style.fontStyle = 'normal';
        }
    }

    document.getElementById('chartVariable').addEventListener('change', (event) => {
        refreshTimeline();
    });

    // State menu change
    document.getElementById('entityId').addEventListener('change', (event) => {
        //entityId = event.target.value;
        refreshTimeline();
     });
    document.querySelectorAll('input[name="whichPer"]').forEach((radio) => {
        radio.addEventListener('change', () => {
            refreshTimeline(); // This will re-fetch emissions and population and update the chart
        });
    });
    document.addEventListener('click', function(event) {
        console.log('Document clicked, target:', event.target);

        const countriesList = document.getElementById('countriesList');
        const whichLinesHolder = document.querySelector('.whichLinesHolder');

        console.log('countriesList:', countriesList); 
        console.log('whichLinesHolder:', whichLinesHolder);
        console.log('whichLinesHolder contains target:', whichLinesHolder ? whichLinesHolder.contains(event.target) : 'null'); 
        
        // Check if click is outside the entire whichLinesHolder area
        if (whichLinesHolder && !whichLinesHolder.contains(event.target)) {
            console.log('Hiding countries list');
            if (countriesList) {
                countriesList.classList.remove('visible');
            }
        } else {
            console.log('Click was inside whichLinesHolder, not hiding'); 
        }
    });
});
</script>

  <script>
    function updateTimelineNav() {
      // Define all goals with their display names
      const goals = [
        { goal: "air", name: "Emissions" },
        { goal: "health", name: "Health" },
        { goal: "jobs", name: "Jobs", extra: "&scope=state" },
        { goal: "economy", name: "Economy" },
        { goal: "biodiverse", name: "Biodiversity" },
        { goal: "water", name: "Water" },
        { goal: "population", name: "Population" }
      ];
  
      // Get the current goal from the hash
      const hash = window.location.hash;
      const goalMatch = hash.match(/goal=([^&]+)/);
      const currentGoal = goalMatch ? goalMatch[1] : "air"; // Default to "air"
  
      // Find the active goal object
      const activeGoal = goals.find(g => g.goal === currentGoal) || goals[0];
      //const inactiveGoals = goals.filter(g => g.goal !== currentGoal);
  
      const allGoals = goals;

      // Clear the container
      const container = document.getElementById('timeline-nav');
      container.innerHTML = '';
  
      // Add the active goal first as "Timeline"
      const activeElement = document.createElement('span');
      activeElement.innerHTML = `<b>${activeGoal.name} Timeline</b>`;
      //container.appendChild(activeElement);
  
      // Add the goals as links
      allGoals.forEach((goal, index) => {
        // Only add separator if not the first item
        if (index > 0) {
            const separator = document.createTextNode(' | ');
            container.appendChild(separator);
        }
        
        if (goal.goal === currentGoal) {
            // Make current goal bold instead of linking it
            const boldText = document.createElement('b');
            boldText.textContent = goal.name;
            boldText.style.marginLeft = '2px';
            boldText.style.marginRight = '2px';
            container.appendChild(boldText);
        } else {
            // Create link for other goals
            const link = document.createElement('a');
            link.href = `#goal=${goal.goal}${goal.extra || ''}`;
            link.textContent = goal.name;
            link.style.marginLeft = '2px';
            link.style.marginRight = '2px';
            link.style.textDecoration = 'none';
            link.className = 'timeline-link';
            container.appendChild(link);
        }
      });
    }
  
    // Run on load and hash change
    document.addEventListener('DOMContentLoaded', updateTimelineNav);
    window.addEventListener('hashchange', updateTimelineNav);
  </script>
